services:
  webui:
    build: ./src/webui
    ports:
      - "3000:80"  # Mapear el puerto 3000 del host al puerto 80 del contenedor
    environment:
      NODE_ENV: production
      
  server:
    build: ./src/server
    ports:
      - "3001:3001"  # Mapear el puerto 3001 del host al puerto 3001 del contenedor
    env_file: "docker.env"
    volumes:
      - server_data:/app/data  # Monta un volumen para persistir los datos del servidor
     
  ollama:
    build: ./src/llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

volumes:
  ollama_data:  # Define el volumen para persistir los datos del servidor
  server_data:  
